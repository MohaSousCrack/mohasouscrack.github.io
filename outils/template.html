<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fibre autour de Rennes — éligibilité par opérateur</title>
<style>/*__LEAFLET_CSS__*/</style>
<style>
:root {
  color-scheme: light;
  --surface-1:  #fcfcfb;   /* panneaux, légende, fiches */
  --plane:      #eae7df;   /* fond de l'application, derrière les panneaux */
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --muted:      #898781;
  --grid:       #e1e0d9;
  --axis:       #c3c2b7;
  --border:     rgba(11,11,11,.10);
  --series-1:   #2a78d6;
  --good:       #0ca30c;
  --warning:    #fab219;
  --serious:    #ec835a;
  --critical:   #d03b3b;
  /* Échelle en paliers, une seule teinte. Le palier le plus clair doit rester
     lisible sur un fond de carte quasi blanc : on démarre au 250, pas au 100. */
  --s0: #86b6ef; --s1: #5598e7; --s2: #2a78d6; --s3: #1c5cab; --s4: #104281;
  --nul: #c3c2b7;          /* « aucun écart » : neutre, hors échelle */
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane:     #0d0d0d;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255,255,255,.10);
    --series-1:  #3987e5;
    /* L'ancrage bas se rapproche de la surface sombre, mais s'arrête au 600 :
       en dessous, les premiers paliers se noient dans le fond. */
    --s0: #184f95; --s1: #2a78d6; --s2: #5598e7; --s3: #86b6ef; --s4: #b7d3f6;
    --nul: #52514e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --plane: #0d0d0d; --ink: #fff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,.10); --series-1: #3987e5;
  --s0: #184f95; --s1: #2a78d6; --s2: #5598e7; --s3: #86b6ef; --s4: #b7d3f6;
  --nul: #52514e;
}

* { box-sizing: border-box; }
/* La page ne défile jamais : seuls le panneau latéral et la carte le font.
   Sans cela, une fiche longue pousse le bandeau et les filtres hors de l'écran. */
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
a { color: var(--series-1); }

/* ---------- en-tête ---------- */
/* Le châssis (bandeau, filtres, pied) porte le plan de fond ; les panneaux de
   contenu restent sur la surface claire. Sans cette séparation, tout se fond
   en un seul aplat blanc. */
header {
  padding: 8px 18px; background: var(--plane); flex: 0 0 auto;
  border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center;
}
.sub { color: var(--muted); font-size: 11.5px; }
.nav { display: flex; gap: 12px; font-size: 12px; }
.nav a { color: var(--ink-2); text-decoration: none; font-weight: 600; }
.nav a:hover { color: var(--ink); text-decoration: underline; }
.prospect { display: block; margin-top: 11px; text-align: center; text-decoration: none;
  background: var(--series-1); color: #fff; border-radius: 8px;
  padding: 10px; font-size: 13px; font-weight: 650; }
.prospect:hover { filter: brightness(1.08); }
.hero { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; align-items: baseline; }
.hero div { display: flex; align-items: baseline; gap: 6px; }
.hero .v { font-size: 17px; font-weight: 700; line-height: 1.1;
           font-variant-numeric: tabular-nums; }
.hero .k { font-size: 11px; color: var(--muted); }

/* ---------- barre de filtres ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 7px 18px; background: var(--plane); flex: 0 0 auto;
  border-bottom: 1px solid var(--border);
}
#mode { max-width: 210px; }
#q { max-width: 168px; }
.grp { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.grp.ops { flex: 0 0 100%; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.grp .lg { font-size: 12px; color: var(--ink-2); }

/* Une bascule par opérateur : neutre, doit être présent, doit être absent. */
.opchips { display: flex; gap: 6px; flex-wrap: wrap; }
.opchip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--axis); background: var(--surface-1); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px;
  font-weight: 600; cursor: pointer;
}
.opchip .et { font-size: 11px; width: 11px; text-align: center; color: var(--muted); }
.opchip[data-e="1"] { border-color: var(--good); color: var(--ink); }
.opchip[data-e="1"] .et { color: var(--good); }
.opchip[data-e="2"] { border-color: var(--critical); color: var(--ink); }
.opchip[data-e="2"] .et { color: var(--critical); }
.raz { font-size: 11.5px; padding: 4px 9px; }
#combi { font-size: 12px; padding: 4px 7px; }
.toolbar label { font-size: 12px; color: var(--ink-2); display: flex;
                 align-items: center; gap: 7px; white-space: nowrap; }
select, input[type=search] {
  font: inherit; font-size: 13px; color: var(--ink);
  background: var(--surface-1); border: 1px solid var(--axis);
  border-radius: 7px; padding: 5px 8px; max-width: 260px;
}
input[type=range] { accent-color: var(--series-1); width: 104px; }
input[type=checkbox] { accent-color: var(--series-1); width: 15px; height: 15px; }
.val { font-variant-numeric: tabular-nums; color: var(--ink);
       font-weight: 600; min-width: 54px; }
button {
  font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer;
  background: var(--surface-1); border: 1px solid var(--axis);
  border-radius: 7px; padding: 5px 10px;
}
button:hover { color: var(--ink); border-color: var(--muted); }

/* ---------- corps ---------- */
.app { flex: 1 1 auto; display: flex; min-height: 0; }
/* Le panneau est le seul à défiler : la fiche d'une commune peut être plus
   haute que l'écran, elle ne doit pas emporter la page avec elle. */
aside {
  width: 372px; flex: none; background: var(--surface-1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
}
#detail { flex: 0 0 auto; }
#map { flex: 1; min-width: 0; background: var(--plane); }
.leaflet-container { background: var(--plane); font: inherit; }

.panel { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
            color: var(--muted); margin: 0 0 9px; font-weight: 600; }

/* légende, en surimpression sur la carte */
.legendbox {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px; max-width: 268px;
  box-shadow: 0 2px 12px rgba(0,0,0,.16);
}
.legendbox .bascule { display: flex; align-items: center; gap: 7px; width: 100%;
  background: none; border: none; padding: 0; margin: 0 0 8px; cursor: pointer;
  font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-weight: 600; text-align: left; }
.legendbox .chev { margin-left: auto; transition: transform .15s; }
.legendbox.replie .bascule { margin-bottom: 0; }
.legendbox.replie .chev { transform: rotate(-90deg); }
.legendbox.replie .legend { display: none; }
.legend { display: flex; flex-direction: column; gap: 3px; }
.legend .row { display: flex; align-items: center; gap: 9px; font-size: 12px;
               color: var(--ink-2); }
.swatch { width: 22px; height: 11px; border-radius: 2px; flex: none;
          box-shadow: 0 0 0 1px var(--border) inset; }

/* liste (vue tableau) */
.listwrap { flex: 1 0 auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; background: var(--surface-1); z-index: 2;
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 600; text-align: right;
  padding: 9px 16px 7px; border-bottom: 1px solid var(--grid);
}
thead th:first-child { text-align: left; }
tbody td { padding: 6px 16px; border-bottom: 1px solid var(--grid);
           font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
tbody td:first-child { text-align: left; font-variant-numeric: normal; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--plane); }
tbody tr[aria-selected=true] td { background: var(--plane); font-weight: 600; }
td .dep { color: var(--muted); font-size: 11px; margin-left: 5px; }
td .neuf { display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 4px;
           font-size: 10px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .04em; color: var(--ink);
           background: var(--warning); vertical-align: 1px; }
td .neuf.orange { background: var(--serious); }
td .neuf.vert { background: var(--good); color: #fff; }
.empty { padding: 26px 16px; color: var(--muted); font-size: 13px; }

/* fiche commune */
#detail { display: none; }
#detail.on { display: block; }
.dhead { display: flex; align-items: baseline; gap: 8px; }
.dhead .nom { font-size: 16px; font-weight: 650; }
.dhead button { margin-left: auto; padding: 2px 7px; }
.dmeta { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
.op { display: grid; grid-template-columns: 78px 1fr 44px; align-items: center;
      gap: 9px; margin-bottom: 7px; }
.op .nm { font-size: 13px; color: var(--ink-2); }
.op .track { height: 9px; background: var(--grid); border-radius: 4px;
             overflow: hidden; }
.op .fill { height: 100%; background: var(--series-1);
            border-radius: 0 4px 4px 0; }
.op .fill.ok { background: var(--good); }
.op .vu { margin-left: 5px; padding: 0 4px; border-radius: 3px; font-size: 9.5px;
          font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
          background: var(--good); color: #fff; vertical-align: 1px; }
.dsub .src { text-transform: none; letter-spacing: 0; font-weight: 400;
             color: var(--muted); }
.op .pc { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums;
          color: var(--ink); }
.cadre { font-size: 12px; color: var(--ink-2); background: var(--plane);
         border: 1px solid var(--border); border-radius: 7px;
         padding: 7px 9px; margin: 2px 0 12px; }
.cadre b { font-weight: 650; color: var(--ink); }
.alerte { font-size: 12px; line-height: 1.5; color: var(--ink-2); margin-top: 11px;
          padding: 9px 11px; border-radius: 8px; background: var(--plane);
          border: 1px solid var(--border); border-left: 3px solid var(--warning); }
.alerte b { color: var(--ink); font-weight: 650; }
.alerte.neuve { border-left-color: var(--good); }
.alerte.cours { border-left-color: var(--series-1); }
.alerte.tard { border-left-color: var(--serious); }
.alerte.verif { border-left-color: var(--good); }
.comp { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px;
        font-size: 12px; color: var(--ink-2); margin: 0 0 11px;
        padding: 7px 9px; border-radius: 7px; background: var(--plane);
        border: 1px solid var(--border); }
.comp b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.comp .pmn { flex: 0 0 100%; color: var(--muted); font-size: 11px; }
.dsub { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 11px 0 3px; }
.chip { font-size: 11px; padding: 2px 8px 2px 6px; border-radius: 999px;
        border: 1px solid var(--border); color: var(--ink-2);
        display: inline-flex; align-items: center; gap: 4px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.note { font-size: 12px; color: var(--ink-2); margin-top: 10px;
        padding-top: 10px; border-top: 1px solid var(--grid); }
.note b { font-weight: 650; }

.leaflet-bar.retour a { width: auto; padding: 0 9px; font-size: 12px;
  font-weight: 600; line-height: 26px; height: 26px; color: var(--ink);
  background: var(--surface-1); }
.leaflet-bar.retour a:hover { background: var(--plane); }
.leaflet-tooltip.tip {
  background: var(--surface-1); color: var(--ink); border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 7px;
  padding: 6px 9px; font: inherit; font-size: 12px;
}
.leaflet-tooltip.tip b { font-size: 13px; }
.leaflet-tooltip.tip .m { color: var(--ink-2); }

footer { padding: 9px 20px; font-size: 11px; color: var(--muted);
         background: var(--plane); border-top: 1px solid var(--border); }
footer code { font-size: 10.5px; color: var(--ink-2);
              background: var(--surface-1); padding: 1px 4px; border-radius: 4px; }

/* ---------- téléphone ----------
   Sur mobile la carte prend tout l'écran ; les filtres et la liste passent en
   panneaux coulissants, comme dans l'app de tournée. Empiler la mise en page
   du bureau repoussait la carte à un écran entier de défilement. */
.mbar { display: none; }
.sheetbar { display: none; }
.backdrop { display: none; }

@media (max-width: 820px) {
  body { height: 100%; overflow: hidden; }
  header { display: none; }
  /* le pied de page est déplacé dans le panneau des filtres */
  footer { background: none; border-top: 1px solid var(--grid);
           padding: 12px 0 0; font-size: 10.5px; }

  .mbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    padding: 9px 12px calc(9px + env(safe-area-inset-top));
    background: var(--plane); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .mbar .mhome { color: var(--ink-2); text-decoration: none; font-size: 15px; }
  .mbar .mtitle { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .mbar .mspacer { flex: 1; }
  .mbar button { padding: 7px 11px; font-size: 12.5px; font-weight: 600; }
  .mbar .mstats { flex: 0 0 100%; font-size: 11.5px; color: var(--muted);
                  font-variant-numeric: tabular-nums; }
  .mbar .mstats b { color: var(--ink); font-weight: 700; }

  .app { flex: 1; flex-direction: column; min-height: 0; }
  #map { flex: 1; min-height: 0; width: 100%; }

  .toolbar, aside {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; z-index: 5000; max-height: 80vh; overflow-y: auto;
    background: var(--surface-1);
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 34px rgba(0,0,0,.34);
    transform: translateY(101%); transition: transform .22s ease;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .toolbar.open, aside.open { transform: none; }
  .toolbar { display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
  .toolbar label { justify-content: space-between; font-size: 13px; }
  .toolbar select, .toolbar input[type=search] { max-width: 58%; }
  .toolbar input[type=range] { width: 58%; }

  .sheetbar {
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 2; margin: -1px -1px 0;
    padding: 12px 16px 10px; background: var(--surface-1);
    border-bottom: 1px solid var(--grid); border-radius: 16px 16px 0 0;
  }
  .sheetbar b { font-size: 13px; }
  .toolbar .sheetbar { margin-bottom: -4px; }

  .backdrop { position: fixed; inset: 0; z-index: 4500;
              background: rgba(10,12,16,.5); }
  .backdrop.open { display: block; }

  .listwrap { overflow: visible; min-height: 0; }
  aside { border-right: none; }

  /* la légende occupait les deux tiers de la carte : repliée par défaut */
  .legendbox { max-width: 64vw; padding: 8px 10px; }
  .leaflet-bottom.leaflet-left { max-width: 70vw; }
}
</style>
</head>
<body>

<div class="mbar">
  <a class="mhome" id="mhome" href="index.html" hidden>◀</a>
  <span class="mtitle">Carte fibre</span>
  <span class="mspacer"></span>
  <button id="mFiltres">Filtres</button>
  <button id="mListe">Communes</button>
  <span class="mstats" id="mstats"></span>
</div>
<div class="backdrop" id="backdrop"></div>

<header>
  <div class="nav" id="nav"></div>
  <h1>Fibre autour de Rennes, opérateur par opérateur</h1>
  <div class="sub" id="maj"></div>
  <div class="hero">
    <div><span class="v" id="h-communes">—</span><span class="k">communes</span></div>
    <div><span class="v" id="h-ecart">—</span><span class="k">concernées</span></div>
    <div><span class="v" id="h-adr">—</span><span class="k">adresses</span></div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="sheetbar"><b>Filtres</b><button data-ferme="toolbar">Fermer</button></div>

  <div class="grp ops">
    <span class="lg">Chez qui ça passe</span>
    <div class="opchips" id="opchips"></div>
    <select id="combi" title="Comment combiner les opérateurs barrés">
      <option value="ou">au moins un barré absent</option>
      <option value="et">tous les barrés absents</option>
    </select>
    <button class="raz" id="raz" title="Revenir au réglage de départ">Réinitialiser</button>
  </div>

  <div class="grp">
    <label>Colorer par
      <select id="mode"></select>
    </label>
    <label>Part min.
      <select id="part">
        <option value="0">toutes</option>
        <option value="0.05" selected>≥ 5 %</option>
        <option value="0.25">≥ 25 %</option>
        <option value="0.5">≥ 50 %</option>
      </select>
    </label>
    <label>Taille min.
      <select id="taille">
        <option value="0">toutes</option>
        <option value="100">≥ 100 adr.</option>
        <option value="300" selected>≥ 300 adr.</option>
        <option value="1000">≥ 1 000 adr.</option>
      </select>
    </label>
    <label>Ancienneté
      <select id="age" title="Depuis quand la fibre est posée dans la commune">
        <option value="tout">toutes</option>
        <option value="neuve">fibre neuve (dernier relevé)</option>
        <option value="cours">déploiement en cours</option>
        <option value="posee">installée, déploiement fini</option>
      </select>
    </label>
    <label title="Free, Bouygues et SFR au complet mais pas Orange : un retard de déclaration, presque jamais une absence réelle">
      <input type="checkbox" id="stable"> Masquer les anomalies Orange</label>
    <label>Trajet
      <select id="transport">
        <option value="v">en voiture</option>
        <option value="t">en TER ou car</option>
      </select>
    </label>
    <label>au plus
      <input type="range" id="tmax" min="15" step="5">
      <span class="val" id="tmax-v"></span>
    </label>
    <input type="search" id="q" placeholder="Chercher une commune…">
    <button id="csv">Exporter en CSV</button>
    <button id="theme" title="Bascule clair / sombre / automatique"></button>
  </div>
</div>

<div class="app">
  <aside id="aside">
    <div class="sheetbar"><b>Communes</b><button data-ferme="aside">Fermer</button></div>
    <div class="panel" id="detail"></div>
    <div class="listwrap">
      <table>
        <thead><tr>
          <th>Commune</th><th id="th-metric">Valeur</th><th>Trajet</th><th>Adr. fibre</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Aucune commune ne correspond à ces filtres.</div>
    </div>
  </aside>
  <main id="map"></main>
</div>

<footer id="foot"></footer>

<script>/*__LEAFLET_JS__*/</script>
<script>
"use strict";
const DATA = "__DATA__";
const F = DATA.features;
/* Vrai quand la page est publiée dans le site (index.html + tournee.html à
   côté) ; faux quand la carte est distribuée seule, pour ne pas afficher des
   liens qui pointeraient dans le vide. */
const SITE = "__SITE__";
/* Le site est statique : ces dates sont figées à la génération, il ne se met
   pas à jour tout seul. Relancer les scripts les rafraîchit. */
const MAJ = "__MAJ__";
/* index code INSEE -> propriétés, utilisé à chaque redessin */
const parCode = new Map(F.map(f => [f.properties.c, f.properties]));

const nf = new Intl.NumberFormat("fr-FR");
function pf(v) {
  const x = v * 100;
  if (x > 0 && x < 0.1) return "< 0,1 %";          /* jamais arrondir à « 0 % » */
  const s = Math.abs(x - Math.round(x)) < 0.05 ? String(Math.round(x)) : x.toFixed(1);
  return s.replace(".", ",") + " %";
}
const dur = m => m < 60 ? m + " min" : Math.floor(m / 60) + " h " +
                 String(m % 60).padStart(2, "0");

/* Une poignee d'adresses d'ecart releve du bruit de relevé, pas d'une vraie
   difference commerciale : on ne parle d'ecart qu'au-dela de ce seuil. */
const SEUIL = 0.05;
const devance = p => p.ftth > 0 && p.fav / p.ftth >= SEUIL;

/* Mode de trajet courant : « v » voiture, « t » TER ou car. Une bonne partie
   de la Bretagne n'a aucune desserte ferroviaire ni routiere reguliere, d'ou
   un temps « t » absent sur ces communes. */
let transport = "v";
const temps = p => (transport === "v" ? p.v : p.t);
const PLAFOND = { v: 0, t: 0 };
for (const f of F) {
  if (f.properties.v > PLAFOND.v) PLAFOND.v = f.properties.v;
  if (f.properties.t > PLAFOND.t) PLAFOND.t = f.properties.t;
}
for (const k of ["v", "t"]) PLAFOND[k] = Math.ceil(PLAFOND[k] / 15) * 15;

/* ------------------------------------------------------------------ modes */
/* Toutes les mesures sont séquentielles (une grandeur continue) : une seule
   teinte, du clair au foncé. Les bornes changent selon la mesure, parce qu'un
   écart entre opérateurs se concentre près de 0 alors qu'une couverture se
   concentre près de 100 %. */
const ECART = [.01, .05, .20, .60, 1.0001];
const COUV  = [.5, .8, .95, .99, 1.0001];

/* ------------------------------------------- combinaison d'opérateurs ----- */
/* Chaque adresse fibrée porte un masque : bit 0 Free, 1 Orange, 2 Bouygues,
   3 SFR. p.mk donne le nombre d'adresses par masque, ce qui permet de compter
   exactement n'importe quel croisement. */
const OPERATEURS = [
  { bit: 1, nom: "Free" },
  { bit: 2, nom: "Orange" },
  { bit: 4, nom: "Bouygues" },
  { bit: 8, nom: "SFR" },
];
const NEUTRE = 0, PRESENT = 1, ABSENT = 2;
const DEFAUT = { 1: PRESENT, 2: ABSENT, 4: ABSENT, 8: ABSENT };
let etats = Object.assign({}, DEFAUT);
let combi = "ou";                       /* « ou » : au moins un barré absent */

const requis = () => OPERATEURS.reduce((m, o) => etats[o.bit] === PRESENT ? m | o.bit : m, 0);
const barres = () => OPERATEURS.reduce((m, o) => etats[o.bit] === ABSENT ? m | o.bit : m, 0);

function comptePourCombinaison(p) {
  const req = requis(), abs = barres();
  let n = 0;
  for (const k in p.mk) {
    const m = +k;
    if ((m & req) !== req) continue;
    if (abs) {
      /* « et » : aucun des barrés présent. « ou » : au moins un manquant. */
      if (combi === "et" ? (m & abs) !== 0 : (m & abs) === abs) continue;
    }
    n += p.mk[k];
  }
  return n;
}

function libelleCombinaison() {
  const p = OPERATEURS.filter(o => etats[o.bit] === PRESENT).map(o => o.nom);
  const a = OPERATEURS.filter(o => etats[o.bit] === ABSENT).map(o => o.nom);
  if (!p.length && !a.length) return "Toutes les adresses fibrées";
  const bouts = [];
  if (p.length) bouts.push(p.join(" et ") + (p.length > 1 ? " présents" : " présent"));
  if (a.length) {
    bouts.push(combi === "et" || a.length === 1
      ? a.join(" et ") + (a.length > 1 ? " absents" : " absent")
      : "au moins un de " + a.join(", ") + " absent");
  }
  return bouts.join(", ");
}

const MODES = [
  { id: "combi", lbl: "Combinaison d'opérateurs",
    num: comptePourCombinaison, den: p => p.ftth, bins: ECART, kind: "pct",
    court: "Part", legende: () => "Part des adresses fibrées de la commune où : " +
      libelleCombinaison().toLowerCase() },
  { id: "neuf", lbl: "Fibre posée au dernier relevé",
    num: p => p.neuf, den: p => p.ftth, bins: ECART, kind: "pct",
    court: "Neuve", legende: () => "Part des adresses raccordables apparues à la " +
      "dernière publication Arcep" },
  { id: "depl", lbl: "Déploiement de la fibre", num: p => p.ftth, den: p => p.tot,
    bins: COUV, kind: "pct", court: "Fibré",
    legende: () => "Part des adresses de la commune raccordables à la fibre" },
  { id: "temps", lbl: "Temps de trajet depuis Rennes",
    num: p => temps(p) ?? 0, den: () => 1, bins: [30, 60, 90, 120, 1e9],
    kind: "min", court: "Trajet",
    legende: () => "Temps de trajet depuis Rennes selon le mode choisi dans les filtres" },
];

/* Cinq paliers pour toutes les mesures : au-delà, les marches deviennent trop
   proches pour rester distinguables (contrôlé avec le validateur de palette). */
const RAMPE = ["--s0", "--s1", "--s2", "--s3", "--s4"];

/* Doit correspondre au point de rupture CSS des panneaux coulissants. */
const TEL = matchMedia("(max-width: 820px)");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let mode = MODES[0];
const valeur = p => { const d = mode.den(p); return d ? mode.num(p) / d : 0; };

function classe(v) {
  if (mode.kind === "pct" && mode.bins === ECART && v === 0) return -1;
  for (let i = 0; i < mode.bins.length; i++) if (v <= mode.bins[i]) return i;
  return mode.bins.length - 1;
}
const couleur = v => { const c = classe(v); return c < 0 ? css("--nul") : css(RAMPE[c]); };

function bornes() {
  const fmt = mode.kind === "min" ? dur : pf;
  const out = [];
  if (mode.bins === ECART) out.push({ c: css("--nul"), t: "aucun écart" });
  let prev = 0;
  mode.bins.forEach((b, i) => {
    const dernier = i === mode.bins.length - 1;
    const t = dernier ? "plus de " + fmt(prev)
            : i === 0 ? "jusqu'à " + fmt(b)
            : fmt(prev) + " – " + fmt(b);
    out.push({ c: css(RAMPE[i]), t });
    prev = b;
  });
  return out;
}

/* ------------------------------------------------------------------ carte */
/* Un cran de zoom en moins sur téléphone : à niveau égal, un écran étroit ne
   montrerait qu'une poignée de communes autour de Rennes. */
const map = L.map("map", { preferCanvas: true });

/* Fonds de plan neutres : un fond coloré se battrait avec l'aplat des communes. */
const FONDS = {
  clair:  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  sombre: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
};
let fond = null;
function majFond(nuance) {
  if (fond) map.removeLayer(fond);
  fond = L.tileLayer(FONDS[nuance], {
    maxZoom: 20, subdomains: "abcd",
    attribution: "© OpenStreetMap, © CARTO"
  }).addTo(map);
  fond.bringToBack();
}


/* Repère fixe : on se perd vite en déplaçant la carte, et Rennes est le point
   de référence de tous les temps de trajet. */
/* On ouvre sur Rennes : c'est le point de référence de tous les temps de
   trajet, et le centre naturel de la zone couverte. */
const RENNES = parCode.get("35238");
const VUE_RENNES = [RENNES ? [RENNES.lat, RENNES.lon] : [48.11, -1.68],
                    TEL.matches ? 9 : 10];
map.setView(VUE_RENNES[0], VUE_RENNES[1]);
const retourRennes = L.control({ position: "topleft" });
retourRennes.onAdd = function () {
  const d = L.DomUtil.create("div", "leaflet-bar retour");
  d.innerHTML = '<a href="#" role="button" title="Recentrer sur Rennes">⌖ Rennes</a>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d, "click", e => {
    L.DomEvent.preventDefault(e);
    map.setView(VUE_RENNES[0], VUE_RENNES[1]);
  });
  return d;
};
retourRennes.addTo(map);

const boiteLegende = L.control({ position: "bottomleft" });
boiteLegende.onAdd = function () {
  this._div = L.DomUtil.create("div", "legendbox");
  L.DomEvent.disableClickPropagation(this._div);
  return this._div;
};
boiteLegende.addTo(map);

const groupe = L.layerGroup().addTo(map);
const couches = new Map();
let selection = null;

function style(p) {
  return {
    fillColor: couleur(valeur(p)), fillOpacity: .78,
    color: css("--surface-1"),           /* filet de surface entre communes */
    weight: p.c === selection ? 3 : 1,
    opacity: 1
  };
}

L.geoJSON(DATA, {
  style: f => style(f.properties),
  onEachFeature: (f, layer) => {
    const p = f.properties;
    couches.set(p.c, layer);
    layer.on("mouseover", () => layer.setStyle({ weight: 3, color: css("--ink") }));
    layer.on("mouseout", () => layer.setStyle(style(p)));
    layer.on("click", () => selectionner(p.c, false));
    layer.bindTooltip(() => {
      const m = temps(p);
      return `<b>${p.n}</b><br><span class="m">${mode.court} : </span>` +
             (mode.kind === "min" ? dur(m) : pf(valeur(p))) +
             `<br><span class="m">${nf.format(p.ftth)} adresses fibrées · ` +
             `${dur(m)} de Rennes ${transport === "v" ? "en voiture" : "en TER/car"}` +
             `</span>`;
    }, { className: "tip", sticky: true });
  }
});

/* ------------------------------------------------------------- filtres */
const el = id => document.getElementById(id);
let visibles = [];

function filtrer() {
  const tmax = +el("tmax").value, taille = +el("taille").value;
  const partMin = +el("part").value;
  const q = el("q").value.trim().toLowerCase();
  const illimite = tmax >= PLAFOND[transport];
  const filtreOps = requis() || barres();
  visibles = F.filter(f => {
    const p = f.properties;
    const m = temps(p);
    if (m == null) return false;          /* pas desservie dans ce mode */
    if (!illimite && m > tmax) return false;
    if (p.ftth < taille) return false;
    /* La part minimale porte sur la combinaison d'opérateurs demandée. */
    if (filtreOps && partMin && comptePourCombinaison(p) / p.ftth < partMin) return false;
    if (!AGES[el("age").value](p)) return false;
    if (el("stable").checked && orangeDouteux(p)) return false;
    if (q && !p.n.toLowerCase().includes(q)) return false;
    return true;
  });
  visibles.sort((a, b) => {
    const d = valeur(b.properties) - valeur(a.properties);
    if (d) return mode.kind === "min" ? -d : d;
    return b.properties.ftth - a.properties.ftth;
  });
  dessiner();
}

function dessiner() {
  const vus = new Set(visibles.map(f => f.properties.c));
  couches.forEach((layer, code) => {
    const dedans = vus.has(code);
    const surCarte = groupe.hasLayer(layer);
    if (dedans && !surCarte) groupe.addLayer(layer);
    else if (!dedans && surCarte) groupe.removeLayer(layer);
    if (dedans) layer.setStyle(style(parCode.get(code)));
  });
  majLegende(); majListe(); majHero();
}

let legendeRepliee = null;
function majLegende() {
  const boite = boiteLegende._div;
  if (legendeRepliee === null) legendeRepliee = TEL.matches;   /* repliée d'office sur mobile */
  const titre = mode.id === "combi" ? libelleCombinaison() : mode.lbl;
  boite.innerHTML =
    `<button class="bascule" type="button">${titre}<span class="chev">▾</span></button>` +
    `<div class="legend">` +
    bornes().map(b =>
      `<div class="row"><span class="swatch" style="background:${b.c}"></span>${b.t}</div>`
    ).join("") +
    `<div class="row" style="margin-top:6px;color:var(--muted)">${mode.legende()}.</div></div>`;
  boite.classList.toggle("replie", legendeRepliee);
  boite.querySelector(".bascule").onclick = () => {
    legendeRepliee = !legendeRepliee;
    boite.classList.toggle("replie", legendeRepliee);
  };
}

function majHero() {
  /* Les deux compteurs suivent la combinaison demandée, pas une mesure figée. */
  const adr = visibles.reduce((s, f) => s + comptePourCombinaison(f.properties), 0);
  const communes = visibles.filter(f => comptePourCombinaison(f.properties) > 0).length;
  el("h-communes").textContent = nf.format(visibles.length);
  el("h-ecart").textContent = nf.format(communes);
  el("h-adr").textContent = nf.format(adr);
  el("mstats").innerHTML = `<b>${nf.format(visibles.length)}</b> communes · ` +
                           `<b>${nf.format(adr)}</b> adresses correspondantes`;
}

function majListe() {
  el("th-metric").textContent = mode.court;
  el("empty").hidden = visibles.length > 0;
  el("rows").innerHTML = visibles.slice(0, 400).map(f => {
    const p = f.properties;
    const v = mode.kind === "min" ? dur(temps(p)) : pf(valeur(p));
    const neuf = frais(p)
      ? `<span class="neuf vert" title="Plus de la moitié des adresses raccordables sont apparues à la dernière publication">neuve</span>`
      : orangeDouteux(p)
      ? `<span class="neuf orange" title="Orange seul à la traîne alors que les trois autres couvrent tout : retard de déclaration, pas une absence">Orange ?</span>`
      : "";
    return `<tr data-c="${p.c}" aria-selected="${p.c === selection}">` +
      `<td>${p.n}<span class="dep">${p.dep}</span>${neuf}</td>` +
      `<td>${v}</td><td>${dur(temps(p))}</td><td>${nf.format(p.ftth)}</td></tr>`;
  }).join("");
}

/* --------------------------------------------------------- fiche commune */
const ETATS = [
  { min: .99, nom: "Disponible",   ic: "✓", cv: "--good" },
  { min: .50, nom: "Partiel",      ic: "◐", cv: "--warning" },
  { min: .05, nom: "Très partiel", ic: "!", cv: "--serious" },
  { min: -1,  nom: "Indisponible", ic: "✕", cv: "--critical" },
];
const etat = v => ETATS.find(e => v >= e.min);

/* Quand une commune vient d'être fibrée, les opérateurs déclarent leur
   commercialisation à des dates différentes : celui qui manque au moment du
   relevé a souvent ouvert depuis. C'est le cas de figure où un écart affiché
   ici est le moins fiable, donc on le dit. */
const NEUF = 0.5;
const frais = p => p.ftth > 0 && p.neuf / p.ftth >= NEUF;

/* Orange seul à la traîne pendant que les trois autres sont au complet : ce
   motif ne tient jamais. Mesuré sur les 2 309 communes de plus de 100 adresses
   fibrées des neuf départements, il ne concernait que 7 communes au relevé
   précédent, et 6 sont passées à 100 % le trimestre suivant sans qu'une seule
   adresse ne s'ajoute. C'est un retard de déclaration, pas une absence. */
/* Orange déclare ses ouvertures à l'Arcep avec du retard, quelle que soit la
   situation des deux autres concurrents. Mesuré sur les neuf départements entre
   les deux dernières publications : sur 18 communes où Free couvrait tout et
   Orange moins de 90 %, 16 sont repassées au-dessus de 90 % au relevé suivant,
   sur les mêmes adresses — dont une de 13 % à 100 % et une de 2 % à 99 %. */
const orangeDouteux = p => p.ftth >= 50 &&
  p.free / p.ftth >= .95 && p.orange / p.ftth < .90;

/* Ancienneté du déploiement. Une commune fraîchement fibrée n'est pas un
   défaut à cacher : c'est l'argument d'entrée le plus fort. Et tant que le
   déploiement n'est pas fini, il reste des prises à poser. */
const enCours = p => p.tot > 0 && p.ftth / p.tot < 0.9;
const AGES = {
  tout:  () => true,
  neuve: p => frais(p),
  cours: p => enCours(p),
  posee: p => !frais(p) && !enCours(p),
};

/* « Début délai complétude » : la date à laquelle l'opérateur d'infrastructure
   a ouvert la zone arrière d'un point de mutualisation, et à partir de laquelle
   court son obligation de rendre toute la zone raccordable. */
const jour = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";

function completude(p) {
  if (!p.dd1) return "";
  const meme = p.dd1 === p.dd2;
  const bas = [`${p.pm} zone${p.pm > 1 ? "s" : ""} de PM`];
  if (p.zone) bas.push(p.zone);
  if (p.oi) bas.push(p.oi);
  return `<div class="comp"><span>Début délai complétude</span>` +
    `<b>${meme ? jour(p.dd1) : jour(p.dd1) + " → " + jour(p.dd2)}</b>` +
    `<span class="pmn">${bas.join(" · ")}</span></div>`;
}

/* Fin du trimestre couvert par le releve Arcep, et son age en mois. */
const FINS = { 1: "03-31", 2: "06-30", 3: "09-30", 4: "12-31" };
function finTrimestre() {
  const m = /(\d{4})\s*T(\d)/.exec(MAJ.arcep || "");
  return m ? m[1] + "-" + FINS[+m[2]] : null;
}
const MOIS_ARCEP = (() => {
  const f = finTrimestre();
  return f ? Math.floor((Date.now() - new Date(f).getTime()) / 2592000000) : 0;
})();

/* Un seul avertissement, et seulement quand il sert : un operateur donne tres
   bas, sur un releve qui a vieilli, et qu'on n'est pas alle verifier chez lui.
   Le reste du temps la fiche parle d'elle-meme. */
function alerteNeuf(p) {
  const suspects = [];
  if (!p.btd && p.bouygues / p.ftth < .5) suspects.push("Bouygues");
  if (!p.sfd && p.sfr / p.ftth < .5) suspects.push("SFR");
  if (!suspects.length || MOIS_ARCEP < 1) return "";
  return `<div class="alerte"><b>${suspects.join(" et ")} : chiffre à vérifier</b>` +
    ` — relevé Arcep arrêté au ${jour(finTrimestre())}, il y a ${MOIS_ARCEP} mois.` +
    ` Un écart de cette taille se comble souvent sans que l'Arcep le sache :` +
    ` à confirmer sur le site de l'opérateur.</div>`;
}

/* Quels opérateurs ont été relevés chez eux plutôt que dans le relevé Arcep. */
function verifies(p) {
  const l = [];
  if (p.btd) l.push("Bouygues");
  if (p.sfd) l.push("SFR");
  return l;
}

function fiche(p) {
  const ops = [["Free", p.free], ["Orange", p.orange],
               ["Bouygues", p.bouygues], ["SFR", p.sfr]];
  const barres = ops.map(([nom, n]) => {
    const v = p.ftth ? n / p.ftth : 0;
    /* Dire lesquels de ces chiffres viennent de l'opérateur lui-même plutôt
       que du relevé trimestriel : ce sont les seuls qu'on sait à jour. */
    const dv = nom === "Bouygues" ? p.btd : (nom === "SFR" ? p.sfd : null);
    const vu = dv
      ? `<span class="vu" title="Chiffre obtenu chez ${nom} le ${jour(dv)}, ` +
        `pas dans le relevé Arcep">vérifié</span>` : "";
    return `<div class="op"><span class="nm">${nom}${vu}</span>` +
      `<span class="track"><span class="fill${vu ? " ok" : ""}" ` +
      `style="width:${(v*100).toFixed(1)}%"></span></span>` +
      `<span class="pc">${pf(v)}</span></div>`;
  }).join("");
  const chips = ops.map(([nom, n]) => {
    const e = etat(p.ftth ? n / p.ftth : 0);
    return `<span class="chip"><span class="dot" style="background:${css(e.cv)}"></span>` +
           `${e.ic} ${nom} — ${e.nom}</span>`;
  }).join("");
  const gaps = [["SFR", p.fns], ["Bouygues", p.fnb], ["Orange", p.fno]]
    .filter(([, n]) => n > 0)
    .map(([nom, n]) => `${nf.format(n)} adresses où Free passe et pas ${nom}`);
  const nb = x => String(x).replace(".", ",");
  const trajets = [];
  if (p.v != null) {
    trajets.push(`<b>${dur(p.v)}</b> en voiture` + (p.vkm ? ` (${nb(p.vkm)} km)` : ""));
  }
  trajets.push(p.t != null
    ? `<b>${dur(p.t)}</b> en TER ou en car`
      + (p.km ? `, arrêt le plus proche à ${nb(p.km)} km` : "")
    : `pas de desserte dans les horaires publiés — <b>voiture uniquement</b>`);

  /* Deux niveaux à ne pas confondre : d'abord ce qui est fibré tout court,
     ensuite qui le commercialise. « Free 100 % » ne veut pas dire que toute la
     commune est raccordable — seulement toute la part déjà fibrée. */
  const depl = p.tot ? p.ftth / p.tot : 0;
  const reste = p.tot - p.ftth;

  return `<div class="dhead"><span class="nom">${p.n}</span>` +
    `<span style="color:var(--muted);font-size:12px">${p.c}</span>` +
    `<button id="close">Fermer</button></div>` +
    `<div class="dmeta">${nf.format(p.pop)} habitants · depuis Rennes : ` +
    `${trajets.join(" · ")}</div>` + completude(p) +
    `<div class="op"><span class="nm">Fibre posée</span>` +
    `<span class="track"><span class="fill" style="width:${(depl*100).toFixed(1)}%"></span></span>` +
    `<span class="pc">${pf(depl)}</span></div>` +
    `<div class="cadre">${nf.format(p.ftth)} adresses raccordables sur ${nf.format(p.tot)}. ` +
    (reste > 0 ? `Les ${nf.format(reste)} autres ne sont fibrées <b>chez aucun opérateur</b>.`
               : `Toute la commune est raccordable.`) + `</div>` +
    `<h3 class="dsub">Parmi les ${nf.format(p.ftth)} adresses raccordables` +
    (verifies(p).length ? ` <span class="src">— ${verifies(p).join(" et ")} ` +
      `relevé${verifies(p).length > 1 ? "s" : ""} chez eux, le reste d'après ` +
      `l'Arcep</span>` : "") + `</h3>` +
    barres + `<div class="chips">${chips}</div>` + alerteNeuf(p) +
    (gaps.length ? `<div class="note">${gaps.join("<br>")}` +
      (p.fseul ? `<br><b>${nf.format(p.fseul)} adresses où Free est le seul des quatre.</b>` : "") +
      `</div>` : `<div class="note">Les quatre opérateurs se valent sur cette commune.</div>`) +
    (SITE ? `<a class="prospect" href="tournee.html#ville=${encodeURIComponent(p.n)}` +
            `&lat=${p.lat}&lng=${p.lon}&insee=${p.c}">🏠 Ouvrir cette commune dans Ma tournée</a>` : "");
}

function selectionner(code, recadrer) {
  selection = code;
  if (TEL.matches) panneau("aside", true);
  const p = parCode.get(code);
  el("detail").className = "panel on";
  el("detail").innerHTML = fiche(p);
  el("close").onclick = () => {
    selection = null;
    el("detail").className = "panel";
    dessiner();
  };
  const layer = couches.get(code);
  if (layer && recadrer) map.fitBounds(layer.getBounds(), { maxZoom: 12, padding: [40, 40] });
  dessiner();
  /* La fiche s'insère en haut du panneau : on y remonte, sinon un clic sur la
     carte pendant qu'on parcourt la liste ne montre rien. */
  el("aside").scrollTop = 0;
}

/* ------------------------------------------- panneaux coulissants (mobile) */
function panneau(id, ouvrir) {
  el(id).classList.toggle("open", ouvrir);
  el("backdrop").classList.toggle("open",
    el("toolbar").classList.contains("open") || el("aside").classList.contains("open"));
}
function toutFermer() { panneau("toolbar", false); panneau("aside", false); }

el("mFiltres").onclick = () => { panneau("aside", false); panneau("toolbar", true); };
el("mListe").onclick = () => { panneau("toolbar", false); panneau("aside", true); };
el("backdrop").onclick = toutFermer;
document.querySelectorAll("[data-ferme]").forEach(b => {
  b.onclick = () => panneau(b.dataset.ferme, false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") toutFermer(); });

/* Le pied de page vit dans le panneau des filtres sur téléphone, faute de
   place à l'écran — mais son contenu reste le même, pas de doublon. */
function placerPied() {
  const pied = el("foot");
  const cible = TEL.matches ? el("toolbar") : document.body;
  if (pied.parentNode !== cible) cible.appendChild(pied);
}
TEL.addEventListener("change", () => {
  toutFermer();
  placerPied();
  legendeRepliee = TEL.matches;
  majLegende();
  map.invalidateSize();
});

/* ------------------------------------------------------------- câblage */
el("mode").innerHTML = MODES.map(m => `<option value="${m.id}">${m.lbl}</option>`).join("");
el("mode").onchange = e => { mode = MODES.find(m => m.id === e.target.value); filtrer(); };

/* ---------------------------------------- bascules d'opérateurs ---------- */
const MARQUE = { 0: "·", 1: "✓", 2: "✕" };
function dessinerChips() {
  el("opchips").innerHTML = OPERATEURS.map(o =>
    `<button class="opchip" data-bit="${o.bit}" data-e="${etats[o.bit]}" type="button" ` +
    `title="Cliquer : indifférent → doit passer → ne doit pas passer">` +
    `<span class="et">${MARQUE[etats[o.bit]]}</span>${o.nom}</button>`).join("");
  el("combi").disabled = !barres();
}
el("opchips").onclick = e => {
  const b = e.target.closest(".opchip");
  if (!b) return;
  const bit = +b.dataset.bit;
  etats[bit] = (etats[bit] + 1) % 3;
  dessinerChips();
  if (mode.id !== "combi") { mode = MODES[0]; el("mode").value = "combi"; }
  filtrer();
};
el("combi").onchange = e => { combi = e.target.value; filtrer(); };
el("raz").onclick = () => {
  etats = Object.assign({}, DEFAUT);
  combi = "ou"; el("combi").value = "ou";
  mode = MODES[0]; el("mode").value = "combi";
  el("part").value = "0.05"; el("taille").value = "300";
  el("age").value = "tout"; el("stable").checked = false; el("q").value = "";
  dessinerChips(); majCurseur(true); filtrer();
};
el("part").onchange = filtrer;
el("age").onchange = filtrer;
dessinerChips();
function majCurseur(remettreAuMax) {
  const s = el("tmax");
  s.max = PLAFOND[transport];
  if (remettreAuMax || +s.value > +s.max) s.value = s.max;
  el("tmax-v").textContent = +s.value >= +s.max ? "sans limite" : dur(+s.value);
}
el("tmax").oninput = () => { majCurseur(false); filtrer(); };
el("transport").onchange = e => {
  transport = e.target.value;
  majCurseur(true);
  filtrer();
};
el("taille").onchange = filtrer;
el("stable").onchange = filtrer;
el("q").oninput = filtrer;
el("rows").onclick = e => {
  const tr = e.target.closest("tr");
  if (tr) selectionner(tr.dataset.c, true);
};
el("csv").onclick = () => {
  const cols = ["code", "commune", "dep", "habitants", "voiture_min", "route_km",
                "ter_car_min", "adr_fibre", "adr_total", "free", "orange",
                "bouygues", "sfr", "free_sans_sfr", "free_sans_bouygues",
                "free_sans_orange", "free_seul"];
  const vide = x => x == null ? "" : String(x).replace(".", ",");
  const lignes = visibles.map(f => { const p = f.properties;
    return [p.c, `"${p.n}"`, p.dep, p.pop, vide(p.v), vide(p.vkm), vide(p.t),
            p.ftth, p.tot, p.free, p.orange,
            p.bouygues, p.sfr, p.fns, p.fnb, p.fno, p.fseul].join(";"); });
  const blob = new Blob(["﻿" + cols.join(";") + "\n" + lignes.join("\n")],
                        { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fibre-autour-de-rennes.csv";
  a.click();
};
/* ---------------------------------------------------------------- thème */
/* Trois états : « auto » suit le réglage du système, les deux autres le
   forcent. La couleur des communes étant lue dans les variables CSS, tout
   changement de thème impose un redessin. */
const THEMES = [
  { id: "auto",  lbl: "Thème : auto" },
  { id: "light", lbl: "Thème : clair" },
  { id: "dark",  lbl: "Thème : sombre" },
];
let iTheme = 0;
const sombre = () => {
  const t = THEMES[iTheme].id;
  return t === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches
                      : t === "dark";
};

function appliquerTheme(redessiner) {
  const t = THEMES[iTheme].id;
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  el("theme").textContent = THEMES[iTheme].lbl;
  try { localStorage.setItem("carte-fibre-theme", t); } catch (e) { /* mode privé */ }
  majFond(sombre() ? "sombre" : "clair");
  if (redessiner) dessiner();
}

el("theme").onclick = () => { iTheme = (iTheme + 1) % THEMES.length; appliquerTheme(true); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (THEMES[iTheme].id === "auto") appliquerTheme(true);
});

try {
  const garde = localStorage.getItem("carte-fibre-theme");
  const i = THEMES.findIndex(t => t.id === garde);
  if (i >= 0) iTheme = i;
} catch (e) { /* mode privé */ }
appliquerTheme(false);

majCurseur(true);

el("maj").innerHTML = `Données Arcep <b>${MAJ.arcep}</b> · page générée le ` +
  jour(MAJ.genere);

if (SITE) {
  el("nav").innerHTML = '<a href="index.html">◀ Accueil</a>' +
                        '<a href="tournee.html">🏠 Ma tournée</a>';
  el("mhome").hidden = false;
}

/* Arrivée depuis l'app de tournée : #q=Nom de la commune */
function communeDepuisUrl() {
  const h = decodeURIComponent(location.hash.replace(/^#q=/, "").replace(/\+/g, " "));
  if (!h || location.hash.indexOf("#q=") !== 0) return;
  el("q").value = h;
  filtrer();
  const cible = visibles.find(f => f.properties.n.toLowerCase() === h.toLowerCase())
             || visibles[0];
  if (cible) selectionner(cible.properties.c, true);
}

el("foot").innerHTML =
  "Éligibilité : table d'éligibilité Arcep « Ma connexion internet », " +
  "<code>data.arcep.fr/fixe/maconnexioninternet/eligibilite/last/departement/actuel_&lt;dep&gt;.csv.gz</code> — " +
  "une ligne par (adresse, opérateur, technologie) ; seule la technologie FO est retenue. " +
  "Vérifiable adresse par adresse sur <a href=\"https://maconnexioninternet.arcep.fr/\" " +
  "target=\"_blank\" rel=\"noreferrer\">maconnexioninternet.arcep.fr</a> en cliquant sur un immeuble. " +
  "Contours : geo.api.gouv.fr · Trajet en voiture : routage OSRM sur OpenStreetMap, " +
  "depuis le centre de Rennes vers le centre de la commune · Trajet en TER/car : GTFS " +
  "BreizhGo/KORRIGO et SNCF, meilleur trajet d'un jeudi type entre 5 h et 20 h 30, " +
  "3 correspondances maximum.";
placerPied();
filtrer();
communeDepuisUrl();
</script>
