<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparateur de communes — MohaBanger2ouf</title>
<style>
  /* ---------------------------------------------------------------- tokens
     Trois couches : des valeurs brutes, des rôles, puis les composants. Les
     composants ne citent jamais une couleur en dur — c'est ce qui permet de
     retoucher la teinte de l'ensemble en changeant quatre lignes. */
  :root{
    /* primitives — une seule rampe de gris, froide, pas des hex au hasard */
    --n0:#07090C; --n1:#0C0F14; --n2:#12161D; --n3:#171C25;
    --n4:#1F2530; --n5:#2A313E; --n6:#3B4453; --n7:#5A6577;
    --n8:#8A93A3; --n9:#B9C0CB; --n10:#FFFFFF;
    --bleu:#3B82F6; --bleu-clair:#93C5FD; --bleu-sombre:#12233D;
    --vert:#22C55E; --vert-sombre:#0F2A1B;
    --ambre:#F59E0B; --ambre-sombre:#2C2110;
    --rouge:#EF4444; --rouge-sombre:#2C1416;
    --free:#FF2D46; --orange:#FF8A1E; --bouygues:#4DA3FF; --sfr:#2ECC71;

    /* rôles */
    --fond:var(--n0); --surface:var(--n2); --surface-2:var(--n3); --creux:var(--n1);
    --bord:var(--n4); --bord-net:var(--n5);
    --texte:var(--n10); --doux:var(--n8); --faible:var(--n7);
    --accent:var(--bleu);

    /* rythme */
    --r1:8px; --r2:12px; --r3:18px; --pill:999px;
    --ombre:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
    --vite:120ms cubic-bezier(.2,.6,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{background:var(--fond);color:var(--texte);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;letter-spacing:-.005em;
    padding:0 16px calc(56px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto}
  b,strong{font-weight:700}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* ------------------------------------------------------------- en-tête */
  header{padding:26px 0 4px}
  .nav a{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--faible);
    text-decoration:none;transition:color var(--vite)}
  .nav a:hover{color:var(--doux)}
  h1{margin:14px 0 0;font-size:clamp(24px,4.6vw,33px);font-weight:800;
    letter-spacing:-.03em;line-height:1.1}


  /* ------------------------------------------------------------- réglages */
  .cmd{position:sticky;top:0;z-index:20;margin-top:18px;
    background:color-mix(in srgb, var(--fond) 86%, transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--bord);padding:12px 0;
    display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center}
  .champ{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--doux);
    white-space:nowrap}
  .cmd select,.cmd input[type=search],.cmd input[type=text]{
    background:var(--surface);border:1px solid var(--bord);color:var(--texte);
    border-radius:var(--r1);padding:8px 10px;font:inherit;font-size:13px;
    font-weight:600;transition:border-color var(--vite),background var(--vite)}
  .cmd select:hover,.cmd input:hover{border-color:var(--bord-net)}
  .cmd select:focus-visible,.cmd input:focus-visible{outline:none;
    border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .cmd input[type=range]{width:118px;accent-color:var(--accent)}
  .cmd .val{color:var(--texte);font-weight:700;min-width:60px}
  .bascule{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:var(--surface);border:1px solid var(--bord);border-radius:var(--pill);
    padding:7px 13px 7px 10px;font-size:12.5px;font-weight:600;color:var(--doux);
    transition:border-color var(--vite),color var(--vite)}
  .bascule:hover{border-color:var(--bord-net);color:var(--texte)}
  .bascule input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  .bascule:has(input:checked){color:var(--texte);border-color:var(--n6)}

  .compte{margin:16px 0 10px;font-size:13px;color:var(--doux)}
  .compte b{color:var(--texte)}
  .avis{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;
    background:var(--ambre-sombre);border:1px solid #5B4517;border-radius:var(--r2);
    padding:11px 13px;font-size:12.5px;line-height:1.55;color:#F5D99B}
  .avis b{color:#FFF}
  /* `display:flex` l'emporte sinon sur l'attribut hidden du navigateur. */
  .avis[hidden]{display:none}

  /* --------------------------------------------------------------- fiches */
  .carte{position:relative;background:var(--surface);border:1px solid var(--bord);
    border-radius:var(--r3);padding:16px 18px;margin-bottom:10px;
    transition:border-color var(--vite),transform var(--vite),box-shadow var(--vite)}
  .carte:hover{border-color:var(--bord-net);box-shadow:var(--ombre)}
  .carte.top{background:linear-gradient(180deg,var(--surface-2),var(--surface))}
  .carte.top::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;
    border-radius:0 3px 3px 0;background:var(--vert)}
  .carte.ouvre::before{background:var(--accent)}

  .tete{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rang{font-size:12px;font-weight:800;color:var(--faible);min-width:24px}
  .nom{font-size:20px;font-weight:800;letter-spacing:-.025em}
  .dep{font-size:11px;color:var(--faible);font-weight:700}
  .trajet{margin-left:auto;display:flex;align-items:baseline;gap:6px;
    font-size:15px;font-weight:700;white-space:nowrap}
  .trajet small{color:var(--faible);font-weight:500;font-size:11.5px}

  .titre{margin:12px 0 4px;font-size:14px;font-weight:600;color:var(--doux);
    line-height:1.45}
  .titre .gros{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--texte);
    margin-right:2px}
  .titre .sfr{color:var(--sfr)}
  .titre .petit{font-size:16px;font-weight:800;color:var(--n9)}
  .titre .rien{color:var(--faible)}
  .pourquoi{font-size:13px;color:var(--doux);line-height:1.6;max-width:76ch}
  .pourquoi b{color:var(--texte);font-weight:650}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .tag{font-size:11px;font-weight:700;border-radius:var(--pill);padding:4px 10px;
    background:var(--creux);border:1px solid var(--bord);color:var(--doux)}
  .tag.neuve{background:var(--vert-sombre);border-color:#1D5334;color:#8FE5AE}
  .tag.vu{background:var(--bleu-sombre);border-color:#25456F;color:var(--bleu-clair)}

  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 0}
  .op{background:var(--creux);border:1px solid var(--bord);border-radius:var(--r2);
    padding:9px 10px 10px}
  .op .n{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
  .op .p{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
  .op .b{height:3px;border-radius:2px;background:var(--n4);margin-top:7px;overflow:hidden}
  .op .b i{display:block;height:100%;border-radius:2px;transition:width var(--vite)}
  .op .note{font-size:9.5px;font-weight:800;margin-top:6px;letter-spacing:.02em}
  .op .note.vu{color:var(--vert)}
  .op .note.doute{color:var(--ambre)}

  details{margin-top:12px;border-top:1px solid var(--bord);padding-top:10px}
  summary{cursor:pointer;font-size:12px;color:var(--faible);font-weight:700;
    list-style:none;transition:color var(--vite)}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--n6)}
  details[open] summary::before{content:"▾ "}
  summary:hover{color:var(--doux)}
  .detail{margin-top:10px;font-size:12.5px;line-height:1.7;color:var(--doux)}
  .detail b{color:var(--texte)}
  .detail table{border-collapse:collapse;width:100%;font-size:12.5px}
  .detail td{padding:3px 14px 3px 0;vertical-align:top}
  .detail td:first-child{color:var(--faible);white-space:nowrap;width:1%}
  .liens{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .liens a{font-size:12px;font-weight:700;text-decoration:none;color:var(--texte);
    background:var(--surface-2);border:1px solid var(--bord);border-radius:var(--r1);
    padding:8px 12px;transition:border-color var(--vite),background var(--vite)}
  .liens a:hover{border-color:var(--bord-net);background:var(--n4)}

  .vide{border:1px dashed var(--bord-net);border-radius:var(--r3);padding:28px 22px;
    color:var(--doux);font-size:14px;line-height:1.6}
  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--bord);
    font-size:11.5px;color:var(--faible);line-height:1.7}

  a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);
    outline-offset:3px;border-radius:var(--r1)}
  @media (max-width:640px){
    body{padding:0 12px 48px}
    .ops{grid-template-columns:repeat(2,1fr)}
    .trajet{margin-left:0;width:100%;margin-top:2px}
    .carte{padding:14px 15px;border-radius:var(--r2)}
    .titre .gros{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ty":1},{"c":"56088","n":"Île-d'Arz","dep":"56","pop":321,"t":150,"v":223,"vkm":153.1,"km":0.0,"ftth":625,"tot":645,"free":625,"orange":625,"bouygues":625,"sfr":625,"fns":0,"fnb":0,"fno":0,"fav":0,"fseul":0,"neuf":1,"lat":47.59174,"lon":-2.79879,"dd1":"2016-05-30","dd2":"2016-05-30","oi":"Vannes Agglo Numérique","zone":"zone d'initiative publique","pm":1,"m":[0,0],"mb":[0,0],"aty":1}];
const META = {"genere": "2026-08-12", "communes": 1526, "verifiees": 179, "a": 0.808, "b": 15.5};
const el = id => document.getElementById(id);
const nf = new Intl.NumberFormat("fr-FR");
const pf = v => (v * 100).toFixed(v >= .995 ? 0 : 1).replace(".", ",") + " %";
const jour = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
function dur(m){
  if (m == null) return "—";
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return h ? `${h} h${r ? " " + String(r).padStart(2, "0") : ""}` : `${r} min`;
}

/* Ville de départ. Les temps précalculés partent de Rennes ; pour toute autre
   ville on estime le trajet en voiture à partir des coordonnées, que la page a
   déjà. Le modèle est ajusté sur les 1 526 trajets réels depuis Rennes : 4,9 min
   d'erreur médiane, 12 min au 90e centile. Assez juste pour classer, et ça ne
   coûte pas un octet de données en plus. */
let depart = null;
function km(la1, lo1, la2, lo2){
  const r = x => x * Math.PI / 180;
  const h = Math.sin(r(la2 - la1) / 2) ** 2 +
            Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(r(lo2 - lo1) / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function minutes(p, mode){
  if (!depart) return (mode === "v" ? p.v : p.t) ?? null;
  if (p.c === depart.c) return 0;
  /* Ferry ou routage aberrant : la distance ne dit rien du temps réel. Plutôt
     que d'annoncer un chiffre faux, on écarte la commune du classement. */
  if (p.aty) return null;
  return Math.round(META.a * km(depart.lat, depart.lon, p.lat, p.lon) + META.b);
}
const estime = () => !!depart;
const neuve = p => p.ftth > 0 && p.neuf / p.ftth >= .5;
let premier = () => false;
let bonusFraicheur = p => neuve(p) ? 2 : .4;


/* Les concurrents ne pèsent pas pareil, et c'est le terrain qui le dit : une
   absence de SFR est un argument, une absence de Bouygues un petit, une absence
   d'Orange n'en est pas un. Orange ne compte donc pas du tout — ce qui fait
   disparaître, au passage, la principale source d'écarts fantômes. */
const POIDS_BOUYGUES = .25;
const manque = (p, cred) => (cred ? p.m : p.mb) || [0, 0];
const occasion = (p, cred) => {
  const d = manque(p, cred);
  return d[0] + POIDS_BOUYGUES * d[1];
};

/* Ce qui se compte n'est pas un nombre de portes à faire — on les fait toutes —
   mais le nombre de prises où l'argument existe, et sur combien. */
function titre(p, cred){
  const d = manque(p, cred);
  if (!d[0] && !d[1]) {
    return `<span class="rien">SFR et Bouygues desservent toutes les ` +
      `${nf.format(p.ftth)} prises fibre</span>`;
  }
  const bouts = [];
  if (d[0]) bouts.push(`<span class="gros num sfr">${nf.format(d[0])}</span> sans SFR`);
  if (d[1]) bouts.push(`<span class="petit num">${nf.format(d[1])}</span> sans Bouygues`);
  return bouts.join(" · ") + ` <span class="num">sur ${nf.format(p.ftth)} prises fibre</span>`;
}

function raison(p, mode, cred){
  const t = dur(minutes(p, mode));
  const d = manque(p, cred);
  const bouts = [];

  if (neuve(p)) {
    bouts.push(`<b>${nf.format(p.neuf)} prises fibrées ce trimestre</b> : la commune ` +
      `vient d'ouvrir, le porte-à-porte y est neuf.`);
  }
  if (d[0]) {
    bouts.push(`<b>${pf(d[0] / p.ftth)}</b> des prises fibre ne sont pas desservies ` +
      `par SFR, à ${estime() ? "environ " : ""}${t} de ${depart ? depart.n : "Rennes"}.`);
  } else if (d[1]) {
    bouts.push(`SFR passe partout ; il reste ${nf.format(d[1])} prises sans Bouygues, ` +
      `à ${estime() ? "environ " : ""}${t}.`);
  } else {
    bouts.push(`Pas d'argument d'écart : il reste le volume et la fraîcheur.`);
  }

  return bouts.join(" ");
}

function barres(p){
  const l = [["Free", p.free, "--free", null], ["SFR", p.sfr, "--sfr", p.sfd],
             ["Bouygues", p.bouygues, "--bouygues", p.btd], ["Orange", p.orange, "--orange", p.ogd]];
  return `<div class="ops">` + l.map(([nom, n, c, vu]) => {
    const v = p.ftth ? n / p.ftth : 0;
    /* Orange et Bouygues déclarent leurs ouvertures avec du retard : tout ce
       qui n'est pas 100 % chez eux est à prendre avec des pincettes, et sur le
       pas d'une porte ça se paie cher. */
    const doute = (nom === "Orange" || nom === "Bouygues") && !vu && v < .995;
    /* La provenance du chiffre est réservée à la version personnelle.
       L'avertissement « peu fiable », lui, sert au vendeur sans rien révéler :
       il reste partout. */
    const note = 
      doute ? `<div class="note doute" title="${nom} déclare ses ouvertures en ` +
        `retard : en dessous de 100 %, il passe souvent quand même">⚠ peu fiable</div>` : ``;
    return `<div class="op"><div class="n" style="color:var(${c})">${nom}</div>` +
      `<div class="p num">${pf(v)}</div>` +
      `<div class="b"><i style="width:${(v*100).toFixed(1)}%;background:var(${c})"></i></div>` +
      note + `</div>`;
  }).join("") + `</div>`;
}

function tags(p){
  const t = [];


  const depl = p.tot ? p.ftth / p.tot : 1;
  if (depl < .9) t.push(`<span class="tag">${pf(1 - depl)} pas encore fibrée</span>`);
  return t.length ? `<div class="tags">${t.join("")}</div>` : "";
}

function details(p){
  const depl = p.tot ? p.ftth / p.tot : 0;
  const li = [];
  li.push(`<tr><td>Fibre posée</td><td><b>${pf(depl)}</b> — ${nf.format(p.ftth)} prises ` +
    `raccordables sur ${nf.format(p.tot)}</td></tr>`);
  li.push(`<tr><td>Habitants</td><td>${nf.format(p.pop)}</td></tr>`);
  li.push(`<tr><td>Depuis Rennes</td><td>${dur(p.v)} en voiture${p.vkm ? " ("+String(p.vkm).replace(".",",")+" km)" : ""}` +
    ` · ${p.t != null ? dur(p.t) + " en TER ou car" : "pas de desserte"}</td></tr>`);
  const b = p.mb || [0,0], c = p.m || [0,0];
  li.push(`<tr><td>Prises sans SFR</td><td><b>${nf.format(c[0])}</b></td></tr>`);
  if (b[1] || c[1]) li.push(`<tr><td>Prises sans Bouygues</td><td>` +
    `<b>${nf.format(c[1])}</b>` +
    (b[1] !== c[1] ? ` — ${nf.format(b[1])} annoncées, le reste à prendre avec ` +
      `des pincettes` : ``) + `</td></tr>`);
  if (p.dd1) li.push(`<tr><td>Délai complétude</td><td>${jour(p.dd1)}` +
    (p.dd2 && p.dd2 !== p.dd1 ? ` → ${jour(p.dd2)}` : "") +
    (p.pm ? ` · ${p.pm} zone${p.pm>1?"s":""} de PM` : "") +
    (p.zone ? ` · ${p.zone}` : "") + (p.oi ? ` · ${p.oi}` : "") + `</td></tr>`);

  return `<details><summary>Le détail</summary><div class="detail"><table>` +
    li.join("") + `</table><div class="liens">` +
    `<a href="https://mohasouscrack.github.io/tournee.html#ville=${encodeURIComponent(p.n)}` +
    `&lat=${p.lat}&lng=${p.lon}&insee=${p.c}" target="_blank" rel="noreferrer">🏠 Ouvrir dans Ma tournée</a>` +
    `<a href="https://mohasouscrack.github.io/fibre.html#q=${encodeURIComponent(p.n)}" ` +
    `target="_blank" rel="noreferrer">🗺️ Voir sur la carte fibre</a>` +
    `</div></div></details>`;
}

/* Le classement : les prises sans SFR, pondérées par la fraîcheur, divisées par
   le trajet. Deux mille prises à une heure et demie ne valent pas mille à vingt
   minutes. */
function score(p, mode, prio, cred){
  const t = minutes(p, mode);
  if (t == null) return -1;
  const base = occasion(p, cred);
  let mult = neuve(p) ? 1.6 : 1;

  const cout = t / 60 + .5;
  if (prio === "volume") return base * mult;
  if (prio === "proche") return base * mult / (cout * cout);
  if (prio === "frais")  return base * bonusFraicheur(p) / cout;
  return base * mult / cout;
}

function dessiner(){
  const mode = el("mode").value, prio = el("prio").value;
  const cred = el("cred").checked;
  const tmax = +el("tmax").value, taille = +el("taille").value;
  const q = el("q").value.trim().toLowerCase();
  el("tmax-v").textContent = tmax >= 180 ? "sans limite" : dur(tmax);

  let l = DATA.filter(p => {
    const t = minutes(p, mode);
    if (t == null) return false;
    if (tmax < 180 && t > tmax) return false;
    if (p.ftth < taille) return false;
    if (q && !p.n.toLowerCase().includes(q)) return false;
    return true;
  });
  l.forEach(p => p._s = score(p, mode, prio, cred));
  l.sort((a, b) => b._s - a._s || b.ftth - a.ftth);

  const utiles = l.filter(p => occasion(p, cred) > 0 || neuve(p)).length;
  el("compte").innerHTML =
    `<b>${nf.format(l.length)}</b> communes · <b>${nf.format(utiles)}</b> avec un argument`;

  const top = l.slice(0, 60);
  el("liste").innerHTML = top.length ? top.map((p, i) => {
    const cls = (i < 3 ? "top" : "");
    return `<article class="carte ${cls}">` +
      `<div class="tete"><span class="rang num">${i + 1}</span>` +
      `<span class="nom">${p.n}</span><span class="dep">${p.dep}</span>` +
      `<span class="trajet"><span class="num">${estime() ? "≈ " : ""}` +
      `${dur(minutes(p, mode))}</span><small>de ${depart ? depart.n : "Rennes"}</small></span></div>` +
      `<div class="titre">${titre(p, cred)}</div>` +
      `<div class="pourquoi">${raison(p, mode, cred)}</div>` +
      tags(p) + barres(p) + details(p) +
      `</article>`;
  }).join("") + (l.length > 60
    ? `<div class="vide">… et ${nf.format(l.length - 60)} autres communes plus bas dans le classement.</div>`
    : "")
    : `<div class="vide">Aucune commune à moins de ${dur(tmax)} avec ces réglages. ` +
      `Élargis le trajet, ou baisse la taille minimale.</div>`;
}

["mode", "prio", "taille", "cred"].forEach(id => el(id).onchange = dessiner);
el("tmax").oninput = dessiner;
let tq; el("q").oninput = () => { clearTimeout(tq); tq = setTimeout(dessiner, 130); };

/* Le choix de la ville de départ. La liste, ce sont les communes de la page :
   pas d'annuaire à charger, pas d'appel réseau. */
el("communes").innerHTML = DATA
  .map(p => `<option value="${p.n} (${p.dep})"></option>`).join("");
const parNom = new Map(DATA.map(p => [`${p.n} (${p.dep})`.toLowerCase(), p]));
const parNomSeul = new Map(DATA.map(p => [p.n.toLowerCase(), p]));

el("depart").onchange = el("depart").oninput = () => {
  const v = el("depart").value.trim().toLowerCase();
  const trouve = parNom.get(v) || parNomSeul.get(v) || null;
  depart = (!v || v === "rennes" || (trouve && trouve.n === "Rennes")) ? null : trouve;
  if (v && !trouve && !depart) return;      // en cours de frappe, on ne bouge pas
  /* Le TER n'a de sens que depuis Rennes : les horaires ne sont calculés que
     de là. Ailleurs, on ne propose que la voiture plutôt que d'inventer. */
  const ter = el("mode").querySelector('option[value="t"]');
  ter.disabled = !!depart;
  if (depart && el("mode").value === "t") el("mode").value = "v";
  el("estim").hidden = !depart;
  dessiner();
};

el("pied").innerHTML =
  `${nf.format(META.communes)} communes · données du ${jour(META.genere)} · ` +
  `Arcep, OpenStreetMap, horaires GTFS.` +
  ``;

dessiner();
</script>
</body>
</html>
