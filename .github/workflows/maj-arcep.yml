name: Mise à jour des données Arcep

# L'Arcep publie chaque trimestre, avec environ deux mois et demi de décalage,
# à une date qui bouge d'une fois sur l'autre. Plutôt que de deviner le jour,
# on regarde tous les mois s'il y a du neuf : la vérification coûte une requête,
# et le gros du travail ne part que si un nouveau trimestre est sorti.
on:
  schedule:
    - cron: "0 4 15 * *"        # le 15 de chaque mois, 4 h UTC
  workflow_dispatch:
    inputs:
      forcer:
        description: "Reconstruire même sans nouvelle publication"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maj-arcep
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Y a-t-il un nouveau trimestre ?
        id: check
        env:
          FORCER: ${{ inputs.forcer }}
        run: python outils/verifie_trimestre.py

      - name: Reconstruire la carte
        if: steps.check.outputs.nouveau == 'true'
        run: |
          python outils/build_carte.py \
            --cache "$RUNNER_TEMP/arcep" --refresh --site \
            --out "$GITHUB_WORKSPACE/fibre.html"

      - name: Reconstruire les points par commune
        if: steps.check.outputs.nouveau == 'true'
        run: |
          python outils/build_points.py \
            --cache "$RUNNER_TEMP/arcep" \
            --out "$GITHUB_WORKSPACE/points"

      - name: Publier
        if: steps.check.outputs.nouveau == 'true'
        run: |
          git config user.name  "robot Arcep"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun fichier modifié : rien à publier."
            exit 0
          fi
          git commit -m "Données Arcep ${{ steps.check.outputs.publie }} (reconstruction automatique)"
          git push

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Mise à jour Arcep"
            echo ""
            echo "- publication Arcep la plus récente : \`${{ steps.check.outputs.publie }}\`"
            echo "- trimestre embarqué avant ce passage : \`${{ steps.check.outputs.en_ligne }}\`"
            if [ "${{ steps.check.outputs.nouveau }}" = "true" ]; then
              echo "- **le site a été reconstruit et republié**"
            else
              echo "- rien de neuf, aucune reconstruction"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
